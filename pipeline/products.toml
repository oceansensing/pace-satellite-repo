  ["tiles-poc-pace-8d", "poc-pace-8d.json"],
  ["tiles-poc-pace-8d-age", "poc-pace-8d-age.json"],
  ["tiles-pic-pace", "pic-pace.json"],
  ["tiles-pic-pace-8d", "pic-pace-8d.json"],
  ["tiles-pic-pace-8d-age", "pic-pace-8d-age.json"],
]

