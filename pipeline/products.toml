# What this repository publishes: NASA's PACE ocean color and atmosphere
# products, from NASA's ocean color archive (OB.DAAC), each quantity as its
# newest day and as the mean of each cell's clear days over the eight newest,
# on NASA's 4 km grid (0.1 degree for the aerosols, NASA's finest there). One
# product per NASA suite: one file family upstream, one arrival time, one
# fault. The fetcher is the site's `scripts/fetch-pace.py`, whose docstring
# carries the measurements.
#
# **To the second host alone** (`r2_only`, the site pipeline's D13, its note of
# 2026-10-09): every root and tile of these products is published to
# Cloudflare R2 and not to Pages. The roots stay on the `published` branch,
# where the next run seeds from them.
#
# **The budgets are NASA's posting times plus a missed day.** Measured
# 2026-10-08..14 from the catalog's own timestamps: most suites post day D at
# D+1 13:18-16:24 UTC (MOANA to 18:18, the trace gases to 21:54), PAR at D+2
# 13:30, net primary production at D+2 16:00 to D+3 00:30. A root's time is its
# day's start, so the youngest it can be is a day and a half.
#
# Two rules inherited from the sibling repositories:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes**, or the orchestrator exits 2 and stops the publish.
# - **A product that leaves takes its files with it**: the seed leaves a
#   top-level file no product's `writes` claims, and the R2 publish removes it.

# **The paths are relative to the site checkout, not to this workspace.**
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# **One lane, named after the server**: a lock, so two suites never read
# NASA's archive at once.

[steps.bgc]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-bgc"]
lane = "obdaac"

[steps.moana]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-moana"]
lane = "obdaac"

[steps.npp]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-npp"]
lane = "obdaac"

[steps.aop]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-aop"]
lane = "obdaac"

[steps.kd]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-kd"]
lane = "obdaac"

[steps.par]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-par"]
lane = "obdaac"

[steps.iop]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-iop"]
lane = "obdaac"

[steps.aer]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-aer"]
lane = "obdaac"

[steps.trgas]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-trgas"]
lane = "obdaac"

[steps.cloud]
cmd = ["python3", "scripts/fetch-pace.py", "--only=pace-cloud"]
lane = "obdaac"

[products.pace-bgc]
title = "PACE OCI biogeochemistry: chlorophyll-a, phytoplankton carbon, POC and PIC"
step = "bgc"
roots = ["chl-pace.json", "chl-pace-8d.json", "chl-pace-8d-age.json", "phytoc-pace.json", "phytoc-pace-8d.json", "phytoc-pace-8d-age.json", "poc-pace.json", "poc-pace-8d.json", "poc-pace-8d-age.json", "pic-pace.json", "pic-pace-8d.json", "pic-pace-8d-age.json"]
writes = ["chl-pace*.json", "phytoc-pace*.json", "poc-pace*.json", "pic-pace*.json"]
max_age_hours = 72
r2_only = true
namespace = ["python3", "scripts/fetch-pace.py", "--namespace", "--only=pace-bgc"]

[products.pace-bgc.tiles]
build = ["python3", "scripts/fetch-pace.py", "--tiles", "--only=pace-bgc"]
key = ["python3", "scripts/fetch-pace.py", "--tile-key", "--only=pace-bgc"]
cache = "pace-bgc-tiles"
match = [
  ["tiles-chl-pace", "chl-pace.json"],
  ["tiles-chl-pace-8d", "chl-pace-8d.json"],
  ["tiles-chl-pace-8d-age", "chl-pace-8d-age.json"],
  ["tiles-phytoc-pace", "phytoc-pace.json"],
  ["tiles-phytoc-pace-8d", "phytoc-pace-8d.json"],
  ["tiles-phytoc-pace-8d-age", "phytoc-pace-8d-age.json"],
